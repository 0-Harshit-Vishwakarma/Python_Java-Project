<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   EcoTrack | Home
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body class="app-page">
  <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm site-navbar">
   <div class="container-fluid px-4 px-lg-5">
    <a class="navbar-brand brand fw-bold" href="/">
     🌍 EcoTrack
    </a>
    <button aria-controls="ecoNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#ecoNav" data-bs-toggle="collapse" type="button">
     <span class="navbar-toggler-icon">
     </span>
    </button>
    <nav class="collapse navbar-collapse" id="ecoNav">
     <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" data-nav="">
      <a class="nav-link" href="/home">
       Home
      </a>
      <a class="nav-link" data-protected="" href="/dashboard" style="display:none;">
       Dashboard
      </a>
      <a class="nav-link" href="/about">
       About Us
      </a>
      <a class="nav-link" data-register="" href="/register">
       Register
      </a>
      <a class="nav-link" data-login="" href="/login">
       Login
      </a>
      <div class="dropdown account-dropdown" data-user-wrap="" style="display:none;">
       <button aria-expanded="false" class="btn btn-outline-success dropdown-toggle fw-semibold" data-bs-toggle="dropdown" data-user-name="" type="button">
        Username
       </button>
       <ul class="dropdown-menu dropdown-menu-end shadow-sm p-2" data-account-menu="">
       </ul>
      </div>
     </div>
    </nav>
   </div>
  </header>
  <main class="tracker">
   <div class="tracker-head">
    <div>
     <p class="eyebrow">
      STEP 2 OF 4
     </p>
     <h1>
      🏠 Home Energy Use
     </h1>
    </div>
    <div class="progress">
     <i class="active">
     </i>
     <i class="active">
     </i>
     <i class="">
     </i>
     <i class="">
     </i>
    </div>
   </div>
   <form class="tracker-card card border-0 shadow-sm" data-step="2" id="stepForm">
    <label class="form-label">
     Monthly electricity consumption (kWh/month)
     <input class="form-control" min="0" name="electricity" required="" step="any" type="number" value="0"/>
    </label>
    <label class="form-label">
     Monthly piped gas (m&sup3;/month)
     <input class="form-control" min="0" name="gas" required="" step="any" type="number" value="0"/>
    </label>
    <label class="form-label">
     Monthly LPG (kg/month)
     <input class="form-control" min="0" name="lpg" required="" step="any" type="number" value="0"/>
    </label>
    <label class="form-label">
     Renewable energy at home
     <select class="form-select" name="renewable">
      <option>
       None
      </option>
      <option>
       Some
      </option>
      <option>
       Mostly
      </option>
      <option>
       100% renewable
      </option>
     </select>
    </label>
    <div class="tracker-actions">
     <a class="btn btn-outline" href="/transport">
      &larr; Previous
     </a>
     <button class="btn btn-green next-step" type="submit">
      Food &rarr;
     </button>
    </div>
    <div class="message" id="message">
    </div>
   </form>
  </main>
  <script src="script.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
 </body>
</html>
