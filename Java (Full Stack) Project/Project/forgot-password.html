<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>Forgot Password | EcoTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-card card border-0 shadow-lg">
      <div class="auth-card-glow"></div>
      <a class="brand" href="/">🌍 EcoTrack</a>
      <span class="badge rounded-pill text-bg-light mb-3">🔐 Account Recovery</span>
      <h1>Forgot Password</h1>
      <p>Enter your registered email and choose a new password.</p>
      <form id="forgotPasswordForm">
        <label class="form-label">
          Email
          <input class="form-control" name="email" required type="email"/>
        </label>
        <label class="form-label">
          New Password
          <input class="form-control" name="password" minlength="6" required type="password"/>
        </label>
        <label class="form-label">
          Confirm Password
          <input class="form-control" name="confirmPassword" minlength="6" required type="password"/>
        </label>
        <button class="btn btn-success px-4 py-2 btn-green" type="submit">Reset Password</button>
        <div class="message" id="message"></div>
      </form>
      <p class="switch"><a href="/login">← Back to Login</a></p>
    </div>
  </main>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
