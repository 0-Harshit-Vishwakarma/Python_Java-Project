<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Register | EcoTrack
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body class="auth-page">
  <main class="auth-wrap">
   <div class="auth-card card border-0 shadow-lg">
    <div class="auth-card-glow">
    </div>
    <a class="brand" href="/">
     🌍 EcoTrack
    </a>
    <span class="badge rounded-pill text-bg-light mb-3">
     🌿 EcoTrack
    </span>
    <h1>
     Create your account
    </h1>
    <p>
     Start tracking your carbon footprint.
    </p>
    <form id="registerForm">
     <label class="form-label">
      Name
      <input class="form-control" name="name" required=""/>
     </label>
     <label class="form-label">
      Email
      <input class="form-control" name="email" required="" type="email"/>
     </label>
     <label class="form-label">
      Password
      <input class="form-control" minlength="6" name="password" required="" type="password"/>
     </label>
     <label class="form-label">
      Confirm Password
      <input class="form-control" minlength="6" name="confirmPassword" required="" type="password"/>
     </label>
     <button class="btn btn-success px-4 py-2 btn-green" type="submit">
      Create Account
     </button>
     <div class="message" id="message">
     </div>
    </form>
    <p class="switch">
     Already registered?
     <a href="/login">
      Login
     </a>
    </p>
   </div>
  </main>
  <script src="script.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
 </body>
</html>
