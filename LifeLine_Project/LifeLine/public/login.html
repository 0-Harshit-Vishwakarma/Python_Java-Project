<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeLine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

<header class="navbar">
    <div class="container navbar-inner">
        <a class="logo" href="index.html">
            <span class="logo-mark">♥</span>
            LifeLine
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <div class="container">
        <section class="auth-card">
            <span class="eyebrow">Welcome Back</span>
            <h1>Login to LifeLine</h1>
            <p>
                Access your emergency card and keep your important information ready.
            </p>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required autocomplete="email">
                </div>

                <div class="field" style="margin-top: 16px;">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Login</button>
                </div>
            </form>

            <div class="auth-links">
                Don't have an account?
                <a href="register.html">Create one</a>
            </div>

            <div class="auth-links recovery-link">
                Forgot your password?
                <a href="recovery.html">Change it here.</a>
            </div>

        </section>
        </section>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
