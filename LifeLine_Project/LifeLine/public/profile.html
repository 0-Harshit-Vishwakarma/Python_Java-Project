<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | LifeLine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="profile">

<header class="navbar">
    <div class="container navbar-inner">
        <a class="logo" href="dashboard.html">
            <span class="logo-mark">♥</span>
            LifeLine
        </a>

        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="about.html">About</a>

            <div class="account-menu">
                <button class="account-trigger" type="button">
                    <span data-user-name>Account</span>
                    <span class="account-chevron">▾</span>
                </button>

                <div class="account-dropdown">
                    <div class="account-user">
                        <strong data-user-name>Account</strong>
                        <span data-user-email></span>
                    </div>

                    <a class="dropdown-link" href="profile.html">My Profile</a>
                    <button class="dropdown-button dropdown-danger" data-delete-account type="button">Delete Account</button>
                    <button class="dropdown-button" data-logout type="button">Logout</button>
                </div>
            </div>
        </nav>
    </div>
</header>

<main class="page">
    <div class="container">
        <div class="page-header">
            <span class="eyebrow">Account</span>
            <h1>My Profile</h1>
            <p>Manage your LifeLine account information.</p>
        </div>

        <section class="profile-card profile-simple-card">
            <div class="profile-details">
                <div class="profile-detail-row">
                    <span class="profile-detail-label">User Name</span>
                    <strong id="profileName">User</strong>
                </div>

                <div class="profile-detail-row">
                    <span class="profile-detail-label">Email</span>
                    <strong id="profileEmail">user@example.com</strong>
                </div>

                <div class="profile-detail-row">
                    <span class="profile-detail-label">User ID</span>
                    <strong id="profileId">USR001</strong>
                </div>
            </div>

            <div class="profile-actions">
                <a class="btn btn-secondary" href="recovery.html">Change Password</a>
                <button class="btn btn-danger" data-delete-account type="button">Delete Account</button>
            </div>
        </section>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
